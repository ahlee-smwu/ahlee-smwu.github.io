# Site Settings
locale                   : "en-GB"
title                    : "Ahhyeon Lee"
title_separator          : "-"
name                     : &name "Ahhyeon Lee"
description              : &description "M.S. researcher in efficient diffusion models and multimodal affective computing."
url                      : "https://ahlee-smwu.github.io"
baseurl                  : ""
repository               : "ahlee-smwu/ahlee-smwu.github.io"

# Site Author
author:
  name             : "Ahhyeon Lee"
  avatar           : "profile.png"     # place a photo at images/profile.jpg (optional; comment out if none)
  bio              : "M.S. Candidate, IVPL, Sookmyung Women's University. Efficient diffusion & multimodal empathy."
  location         : "Seoul, Republic of Korea"
  employer         : "Intelligent Vision Processing Lab (IVPL)"
  pubmed           :
  googlescholar    : # add if/when you have a profile
  email            : "ah.lee@ivpl.sm.ac.kr"
  researchgate     :
  github           : "ahlee-smwu"
  linkedin         : "https://www.linkedin.com/in/ahhyeon-lee-5b8a50397/"
  orcid            :

# Reading Files
include:
  - .htaccess
  - _pages
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - vendor
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/plugins
  - assets/js/_main.js
  - assets/js/vendor
  - Capfile
  - CHANGELOG
  - config
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - log
  - node_modules
  - package.json
  - Rakefile
  - README
  - tmp
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# Collections
collections:
  publications:
    output: true
    permalink: /:collection/:path/
  portfolio:
    output: true
    permalink: /:collection/:path/

# Defaults
defaults:
  # _pages
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  # _publications
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      share: false
      comments: false
  # _portfolio
  - scope:
      path: ""
      type: portfolio
    values:
      layout: single
      author_profile: true
      share: false

# Outputting
permalink: /:categories/:title/
paginate: 5
paginate_path: /page:num/
timezone: Asia/Seoul

# Plugins
plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jemoji
